<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SnackSphere - Login</title>
  <style>
    /* simple student-style login page */
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #222;
    }

    .card {
      background: #fff;
      width: 360px;
      padding: 20px;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
    }

    .brand { text-align: center; margin-bottom: 12px; }
    .brand h1 { color: #00b894; font-size: 20px; margin: 0; }
    .brand p { margin: 6px 0 0; font-size: 13px; color: #666; }

    form { display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 13px; color: #333; display: block; margin-bottom: 6px; }
    input[type="email"], input[type="password"] {
      padding: 10px;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #666;
    }
    .btn {
      background: #00b894;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:active { transform: translateY(1px); }

    .foot { text-align: center; margin-top: 10px; font-size: 13px; color: #666; }
    .foot a { color: #00b894; text-decoration: none; margin-left: 6px; }

    @media (max-width: 400px) {
      .card { width: 92%; padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>SnackSphere</h1>
      <p>Sign in to continue</p>
    </div>

    <form id="loginForm" action="#" method="post" novalidate>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" required />
      </div>

      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="remember" name="remember" /> Remember me
        </label>
        <a href="#" style="color:#00b894;text-decoration:none;font-size:13px;">Forgot?</a>
      </div>

      <button type="submit" class="btn">Log In</button>

      <div class="foot">
        New here?
        <a href="index.html">Create account</a>
      </div>
    </form>
  </div>
