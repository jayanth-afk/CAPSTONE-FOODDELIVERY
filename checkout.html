<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SnackSphere - Checkout</title>
  <link rel="stylesheet" href="checkout.css">
</head>
<body>
  <div class="wrap">
    <main class="cart">
      <h1>Checkout</h1>
      <p class="small">Check your items, change quantities and place the order.</p>

      <div id="cartItems">
        <div class="item" data-price="89">
          <img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cGl6emElMjBtYXJnaGVyaXRhfGVufDB8fDB8fHww" alt="Margherita">
          <div class="info">
            <p class="title">Margherita — Pizza Palace</p>
            <p class="meta">Small • Extra cheese</p>
            <p class="meta" style="margin-top:6px;">Price: ₹<span class="price">89.00</span></p>
          </div>
          <div class="controls">
            <button class="dec" aria-label="decrease quantity">-</button>
            <input class="qty" type="number" min="1" value="1" />
            <button class="inc" aria-label="increase quantity">+</button>
            <button class="remove">Remove</button>
          </div>
        </div>

        <div class="item" data-price="65">
          <img src="https://c4.wallpaperflare.com/wallpaper/143/223/715/food-burgers-hamburgers-fast-food-wallpaper-preview.jpg" alt="Classic Burger">
          <div class="info">
            <p class="title">Classic Burger — Burger Barn</p>
            <p class="meta">With fries</p>
            <p class="meta" style="margin-top:6px;">Price: ₹<span class="price">65.00</span></p>
          </div>
          <div class="controls">
            <button class="dec" aria-label="decrease quantity">-</button>
            <input class="qty" type="number" min="1" value="2" />
            <button class="inc" aria-label="increase quantity">+</button>
            <button class="remove">Remove</button>
          </div>
        </div>
      </div>

      <div style="text-align:center; margin-top:12px;">
        <button id="clear" style="padding:8px 12px; border:1px solid #ddd; background:#fff; border-radius:6px; cursor:pointer;">Clear cart</button>
      </div>
    </main>

    <aside class="summary">
      <h2>Order Summary</h2>
      <div class="row"><span>Items</span><span>₹<span id="sub">219.00</span></span></div>
      <div class="row"><span>Delivery</span><span>₹<span id="delivery">30.00</span></span></div>
      <div class="row"><span>Discount</span><span>-₹<span id="disc">0.00</span></span></div>
      <div class="row total"><span>Total</span><span>₹<span id="total">249.00</span></span></div>

      <div class="coupon">
        <input id="coupon" placeholder="Enter coupon code" />
        <button id="apply">Apply</button>
      </div>

      <button id="place" class="btn-wide">Place Order</button>
    </aside>
  </div>
</body>
</html>
